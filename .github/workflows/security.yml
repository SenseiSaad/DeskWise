name: Security gates

# Fails the run on HIGH (or critical) severity findings from:
#   pip-audit (Python deps), bandit (Python SAST), pnpm audit (JS deps),
#   semgrep (Python + Django + TypeScript + React rulesets), gitleaks (full history).
# Runs on every push to main, every PR, and weekly so newly published
# advisories are caught even when the code has not changed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-deps:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # pip-audit has no severity filter: any known vulnerability fails the job.
      - run: pip-audit -r requirements.txt --strict --progress-spinner off
      - run: pip-audit -r requirements-optional.txt --strict --progress-spinner off

  python-sast:
    name: bandit (high)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - run: bandit -r core config --severity-level high --confidence-level medium

  js-deps:
    name: pnpm audit (high)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Audits pnpm-lock.yaml directly; no install needed.
      - run: pnpm audit --audit-level high

  semgrep:
    name: semgrep (python + typescript, ERROR)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: >-
          semgrep scan
          --config p/python --config p/django
          --config p/typescript --config p/react
          --severity ERROR --error --metrics=off
          --exclude backend/tests --exclude frontend/node_modules
          backend frontend

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --redact --no-banner
