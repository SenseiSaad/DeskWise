# Deskwise — local development stack.
#
#   docker compose up -d                       # SQLite + LocMem (zero-config)
#
#   # PostgreSQL: uncomment the POSTGRES_* block in .env first, then:
#   docker compose --profile pg up -d
#
#   # Redis (shared rate limits): uncomment CACHE_URL in .env first, then:
#   docker compose --profile redis up -d
#
# For a real deployment use docker-compose.prod.yml (PostgreSQL + Redis + TLS proxy).
# Secrets come from .env in THIS folder (never commit it).
name: openvault

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: "false"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Keep the SQLite file on the persisted data volume.
      SQLITE_PATH: /app/data/db.sqlite3
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # LLM: point at host Ollama or set GEMINI_API_KEY in .env
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_KEY_ENCRYPTION_KEY: ${LLM_KEY_ENCRYPTION_KEY:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-us.amazon.nova-lite-v1:0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${BEDROCK_REGION:-us-east-1}}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      SELFHOSTED_LLM_URL: ${SELFHOSTED_LLM_URL:-}
      SELFHOSTED_LLM_MODEL: ${SELFHOSTED_LLM_MODEL:-qwen2.5:7b}
      # Email (console backend unless SMTP is configured)
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Deskwise <no-reply@deskwise.local>}
      # Database: SQLite by default. With `--profile pg`, set
      # POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD and POSTGRES_HOST=db.
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      # Cache: LocMem by default. With `--profile redis`, set
      # CACHE_URL=redis://redis:6379/0.
      CACHE_URL: ${CACHE_URL:-}
    volumes:
      - ov_data:/app/data
      - ov_media:/app/media
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/api/health || exit 1"]
      interval: 2s
      timeout: 2s
      start_period: 1s
      retries: 15

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Local dev defaults to unlocked so Ollama/Gemini/Bedrock are all testable.
        NEXT_PUBLIC_BETA_PROVIDER: ${NEXT_PUBLIC_BETA_PROVIDER:-off}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      start_period: 1s
      retries: 15

  db:
    image: pgvector/pgvector:pg16
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvault}
      POSTGRES_USER: ${POSTGRES_USER:-openvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ov_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openvault}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ov_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ov_data:
  ov_media:
  ov_pgdata:
  ov_redis:
